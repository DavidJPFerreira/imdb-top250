<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.ttt_title }} - #{{ session_id }}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E6392E'%3E%3Cpath d='M2.00488 9.49979V3.99979C2.00488 3.4475 2.4526 2.99979 3.00488 2.99979H21.0049C21.5572 2.99979 22.0049 3.4475 22.0049 3.99979V9.49979C20.6242 9.49979 19.5049 10.6191 19.5049 11.9998C19.5049 13.3805 20.6242 14.4998 22.0049 14.4998V19.9998C22.0049 20.5521 21.5572 20.9998 21.0049 20.9998H3.00488C2.4526 20.9998 2.00488 20.5521 2.00488 19.9998V14.4998C3.38559 14.4998 4.50488 13.3805 4.50488 11.9998C4.50488 10.6191 3.38559 9.49979 2.00488 9.49979ZM14.0049 4.99979H4.00488V7.96755C5.4866 8.7039 6.50488 10.2329 6.50488 11.9998C6.50488 13.7666 5.4866 15.2957 4.00488 16.032V18.9998H14.0049V4.99979ZM16.0049 4.99979V18.9998H20.0049V16.032C18.5232 15.2957 17.5049 13.7666 17.5049 11.9998C17.5049 10.2329 18.5232 8.7039 20.0049 7.96755V4.99979H16.0049Z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #F4EEDD;
            --bg-paper-alt: #EFECE6;
            --red: #E6392E;
            --yellow: #F4B41A;
            --blue: #1B4965;
            --black: #181818;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-paper);
            background-image: 
                linear-gradient(to right, rgba(24,24,24,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(24,24,24,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--black);
            font-family: 'Space Grotesk', sans-serif; text-align: center; padding: 25px 20px 60px 20px;
        }
        .top-bar {
            max-width: 560px; margin: 0 auto 14px auto;
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .lang-btn {
            background: var(--bg-paper-alt); color: var(--black); border: 3px solid var(--black);
            box-shadow: 3px 3px 0px var(--black); padding: 5px 12px;
            text-decoration: none; font-family: 'Space Mono', monospace; font-size: 0.82rem; font-weight: 700;
            transition: transform 0.15s;
        }
        .lang-btn:hover { transform: translate(-2px, -2px) rotate(-2deg); }
        .lang-btn.active { background: var(--yellow); color: var(--black); transform: rotate(-2deg); }

        .arena {
            max-width: 560px; margin: 0 auto; background: var(--bg-paper-alt);
            padding: 32px; border: 5px solid var(--black);
            box-shadow: 12px 12px 0px var(--black); transform: rotate(-0.5deg);
        }
        /* Stage Badge específico para Disputa de Filtros (Geometria Bauhaus Azul Cobalto) */
        .stage-badge-filter {
            display: inline-block; background: var(--blue); color: var(--bg-paper);
            padding: 8px 20px; border: 4px double var(--bg-paper);
            outline: 3px solid var(--black);
            box-shadow: 4px 4px 0px var(--black);
            font-family: 'Space Mono', monospace; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 16px; font-size: 0.82rem; transform: rotate(-0.7deg);
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif; color: var(--black);
            margin: 0 0 18px 0; font-size: 3rem; letter-spacing: 2px;
            text-shadow: 3px 3px 0px var(--yellow);
        }
        .matchup {
            display: flex; justify-content: space-around; align-items: center;
            background: var(--bg-paper); padding: 14px; border: 4px solid var(--black);
            box-shadow: 5px 5px 0px var(--black); margin-bottom: 20px; transform: rotate(0.7deg);
        }
        .p-card { font-family: 'Bebas Neue', sans-serif; font-size: 1.65rem; letter-spacing: 1px; }
        .p-x { color: var(--red); }
        .p-o { color: var(--blue); }
        .vs-tag {
            background: var(--yellow); border: 2px solid var(--black);
            font-family: 'Space Mono', monospace; font-weight: 700; padding: 3px 8px;
        }
        .turn-indicator {
            font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 1.5px;
            margin-bottom: 20px; color: var(--black); background: var(--yellow);
            display: inline-block; padding: 8px 24px; border: 3px solid var(--black);
            box-shadow: 4px 4px 0px var(--black);
        }

        .board {
            display: grid; grid-template-columns: repeat(3, 112px);
            grid-gap: 0; justify-content: center; margin: 0 auto 24px auto;
            background: var(--black); padding: 6px;
            border: 5px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            transform: rotate(-0.6deg);
            width: fit-content; transform: rotate(-0.7deg);
        }
        .cell {
            width: 112px; height: 112px; background: var(--bg-paper);
            border: 4px solid var(--black);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            user-select: none; position: relative;
            transition: background 0.1s;
        }
        .cell:hover { background: var(--bg-paper-alt); }

        .cell.x::before {
            content: ""; width: 70px; height: 70px;
            background: var(--red);
            clip-path: polygon(12% 0%, 50% 34%, 88% 4%, 100% 18%, 65% 52%, 96% 86%, 80% 100%, 48% 66%, 15% 98%, 0% 82%, 34% 49%, 2% 16%);
            transform: rotate(-4deg);
        }
        .cell.o::before {
            content: ""; width: 68px; height: 68px;
            background: var(--blue);
            clip-path: polygon(20% 2%, 84% 0%, 100% 25%, 96% 85%, 75% 100%, 15% 96%, 0% 74%, 4% 20%, 24% 25%, 22% 72%, 72% 76%, 76% 24%, 22% 24%);
            transform: rotate(3deg);
        }

        .msg-draw {
            background: var(--yellow); color: var(--black); border: 3px solid var(--black);
            padding: 10px; font-family: 'Space Mono', monospace; font-weight: 700;
            margin-bottom: 14px; display: none;
        }
        /* Bloco inferior limpo apenas com o botão de continuar */
        .winner-banner {
            display: none; margin-top: 12px;
        }
        /* Botão-Bilhete com Rasgão até Metade (Igual ao ttt_winner.html) */
        .ticket-tear-btn {
            display: inline-flex; align-items: stretch;
            background: transparent; border: none; padding: 0;
            text-decoration: none; cursor: pointer;
            perspective: 1000px; filter: drop-shadow(6px 6px 0px var(--black));
            transition: filter 0.2s ease, transform 0.2s ease;
        }
        .ticket-tear-btn .t-main {
            background:
                radial-gradient(circle at right top, transparent 10px, var(--red) 10.5px),
                radial-gradient(circle at right bottom, transparent 10px, var(--red) 10.5px);
            background-size: 100% 51%;
            background-position: top, bottom;
            background-repeat: no-repeat;
            color: var(--black);
            padding: 16px 28px;
            border: 3px solid var(--black); border-right: none;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 1.75rem; letter-spacing: 2px;
            text-transform: uppercase;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            transform-origin: left center;
        }
        .ticket-tear-btn .t-perf {
            width: 0; border-left: 3px dashed var(--black);
            background: var(--bg-paper); margin: 10px 0; z-index: 2;
            transition: opacity 0.25s ease;
        }
        .ticket-tear-btn .t-stub {
            background:
                radial-gradient(circle at left top, transparent 10px, var(--red) 10.5px),
                radial-gradient(circle at left bottom, transparent 10px, var(--red) 10.5px);
            background-size: 100% 51%;
            background-position: top, bottom;
            background-repeat: no-repeat;
            color: var(--black);
            padding: 12px 20px;
            border: 3px solid var(--black); border-left: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 700;
            line-height: 1.2;
            transform-origin: top left;
            transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ticket-tear-btn .t-barcode {
            width: 54px; height: 16px; margin-bottom: 4px;
            background: repeating-linear-gradient(90deg, #181818 0, #181818 2px, transparent 2px, transparent 4px, #181818 4px, #181818 7px, transparent 7px, transparent 9px);
        }
        .ticket-tear-btn:hover .t-main {
            transform: rotate(-1.5deg) translateX(-3px);
        }
        .ticket-tear-btn:hover .t-stub {
            transform: translateY(10px) translateX(5px) rotateZ(8deg);
        }
        .ticket-tear-btn:active .t-stub {
            transform: translateY(22px) translateX(12px) rotateZ(16deg);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/set_lang/pt" class="lang-btn {% if lang == 'pt' %}active{% endif %}">PT</a>
        <a href="/set_lang/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">EN</a>
        <a href="/set_lang/es" class="lang-btn {% if lang == 'es' %}active{% endif %}">ES</a>
    </div>

    <div class="arena"
         id="game-arena"
         data-p1-id="{{ p1[0] }}"
         data-p1-name="{{ p1[1] }}"
         data-p2-id="{{ p2[0] }}"
         data-p2-name="{{ p2[1] }}"
         data-txt-turn="{{ t.turn_of }}"
         data-txt-winner="{{ t.ttt_winner }}">

        <span class="stage-badge-filter">FILTER ARENA</span>
        <h1>{{ t.ttt_title }}</h1>

        <div class="matchup">
            <div class="p-card p-x">X — {{ p1[1] }}</div>
            <div class="vs-tag">VS</div>
            <div class="p-card p-o">O — {{ p2[1] }}</div>
        </div>

        <div id="turn-text" class="turn-indicator">{{ t.turn_of }}: {{ p1[1] }} (X)</div>
        <div id="draw-text" class="msg-draw">{{ t.ttt_draw }}</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div id="winner-box" class="winner-banner">
            <form action="/session/{{ session_id }}/tictactoe/record" method="POST">
                <input type="hidden" name="p1_id" value="{{ p1[0] }}">
                <input type="hidden" name="p2_id" value="{{ p2[0] }}">
                <input type="hidden" name="winner_id" id="winner_id" value="">
                <button type="submit" class="ticket-tear-btn">
                    <span class="t-main">{{ t.btn_continue }}</span>
                    <span class="t-perf"></span>
                    <span class="t-stub">
                        <span class="t-barcode"></span>
                        <span>Nº314159</span>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const arena = document.getElementById("game-arena");
            const p1 = { id: arena.getAttribute("data-p1-id"), name: arena.getAttribute("data-p1-name"), symbol: "X" };
            const p2 = { id: arena.getAttribute("data-p2-id"), name: arena.getAttribute("data-p2-name"), symbol: "O" };
            const txtTurn = arena.getAttribute("data-txt-turn");
            const txtWinner = arena.getAttribute("data-txt-winner");

            let current = p1;
            let state = Array(9).fill(null);
            let finished = false;
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

            const cells = document.querySelectorAll(".cell");
            const turnText = document.getElementById("turn-text");
            const drawText = document.getElementById("draw-text");
            const winnerBox = document.getElementById("winner-box");
            const winnerInput = document.getElementById("winner_id");

            function checkWin(sym) {
                return wins.some(function (c) { return state[c[0]] === sym && state[c[1]] === sym && state[c[2]] === sym; });
            }

            cells.forEach(function (cell) {
                cell.addEventListener("click", function () {
                    const idx = parseInt(cell.getAttribute("data-index"), 10);
                    if (finished || state[idx] !== null) return;

                    drawText.style.display = "none";
                    state[idx] = current.symbol;
                    cell.classList.add(current.symbol.toLowerCase());

                    if (checkWin(current.symbol)) {
                        finished = true;
                        turnText.textContent = txtWinner + " " + current.name;
                        winnerInput.value = current.id;
                        winnerBox.style.display = "block";
                        return;
                    }

                    if (state.every(function (v) { return v !== null; })) {
                        setTimeout(function () {
                            state.fill(null);
                            cells.forEach(function (c) { c.textContent = ""; c.className = "cell"; });
                            drawText.style.display = "block";
                        }, 450);
                        return;
                    }

                    current = (current.id === p1.id) ? p2 : p1;
                    turnText.textContent = txtTurn + ": " + current.name + " (" + current.symbol + ")";
                });
            });
        });
    </script>
</body>
</html>

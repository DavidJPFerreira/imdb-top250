<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ t.setup_title }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 25px 20px; text-align: center;
        }
        .top-bar {
            max-width: 520px; margin: 0 auto 20px auto;
            display: flex; justify-content: space-between; align-items: center;
        }
        .lang-group { display: flex; gap: 8px; }
        .lang-btn {
            background: #1e1e1e; color: #ccc; border: 1px solid #444;
            padding: 6px 10px; border-radius: 6px; text-decoration: none;
            font-size: 0.85rem; font-weight: bold;
        }
        .lang-btn.active { background: #f5c518; color: #000; border-color: #f5c518; }
        .back-link { color: #aaa; text-decoration: none; font-size: 0.9rem; }
        h1 { color: #f5c518; font-size: 2rem; margin-bottom: 8px; }
        p.subtitle { color: #b3b3b3; margin-top: 0; margin-bottom: 25px; }
        .setup-box {
            background-color: #1e1e1e; max-width: 520px; margin: 0 auto;
            padding: 30px; border-radius: 14px; border: 1px solid #2e2e2e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        .count-selector { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .count-btn {
            background-color: #2c2c2c; color: #fff; border: 2px solid #444;
            padding: 12px 20px; font-size: 1rem; font-weight: bold;
            border-radius: 8px; cursor: pointer;
        }
        .count-btn.active { background-color: #f5c518; color: #000; border-color: #f5c518; }
        .player-inputs { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .player-row { display: flex; align-items: center; gap: 12px; }
        .player-badge {
            background-color: #333; color: #f5c518; font-weight: bold;
            padding: 10px 14px; border-radius: 8px; min-width: 115px;
        }
        input[type="text"] {
            flex: 1; padding: 12px 14px; border-radius: 8px;
            border: 1px solid #444; background-color: #141414; color: #fff; font-size: 1rem;
        }
        .start-btn {
            width: 100%; background-color: #f5c518; color: #000; font-weight: bold;
            font-size: 1.15rem; padding: 14px; border: none; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="back-link">{{ t.back_home }}</a>
        <div class="lang-group">
            <a href="/set_lang/pt" class="lang-btn {% if lang == 'pt' %}active{% endif %}">🇵🇹 PT</a>
            <a href="/set_lang/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">🇬🇧 EN</a>
            <a href="/set_lang/es" class="lang-btn {% if lang == 'es' %}active{% endif %}">🇪🇸 ES</a>
        </div>
    </div>

    <h1>{{ t.setup_title }}</h1>
    <p class="subtitle">{{ t.setup_subtitle }}</p>

    <div class="setup-box">
        <form action="/start_game" method="POST">
            <input type="hidden" name="num_players" id="num_players" value="2">
            <div class="count-selector">
                <button type="button" class="count-btn active" onclick="setPlayers(2)">{{ t.players_2 }}</button>
                <button type="button" class="count-btn" onclick="setPlayers(3)">{{ t.players_3 }}</button>
                <button type="button" class="count-btn" onclick="setPlayers(4)">{{ t.players_4 }}</button>
            </div>
            <div class="player-inputs">
                <div class="player-row" id="row-1">
                    <span class="player-badge">{{ t.player_label }} 1</span>
                    <input type="text" name="player_1" placeholder="{{ t.player_placeholder }} 1" required>
                </div>
                <div class="player-row" id="row-2">
                    <span class="player-badge">{{ t.player_label }} 2</span>
                    <input type="text" name="player_2" placeholder="{{ t.player_placeholder }} 2" required>
                </div>
                <div class="player-row" id="row-3" style="display: none;">
                    <span class="player-badge">{{ t.player_label }} 3</span>
                    <input type="text" name="player_3" id="input-3" placeholder="{{ t.player_placeholder }} 3">
                </div>
                <div class="player-row" id="row-4" style="display: none;">
                    <span class="player-badge">{{ t.player_label }} 4</span>
                    <input type="text" name="player_4" id="input-4" placeholder="{{ t.player_placeholder }} 4">
                </div>
            </div>
            <button type="submit" class="start-btn">{{ t.btn_start_match }}</button>
        </form>
    </div>

    <script>
        function setPlayers(n) {
            document.getElementById('num_players').value = n;
            document.querySelectorAll('.count-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', (idx + 2) === n);
            });
            for (let i = 3; i <= 4; i++) {
                const row = document.getElementById('row-' + i);
                const inp = document.getElementById('input-' + i);
                row.style.display = (i <= n) ? 'flex' : 'none';
                inp.required = (i <= n);
                if (i > n) inp.value = '';
            }
        }
    </script>
</body>
</html>

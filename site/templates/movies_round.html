<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Ronda de Filmes - Vez de {{ player[2] }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212; color: #fff;
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 30px 20px;
            text-align: center;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .turn-banner {
            background: #f5c518; color: #000; padding: 14px 20px;
            border-radius: 10px; font-weight: bold; font-size: 1.3rem;
            margin-bottom: 10px; display: inline-block; min-width: 340px;
        }
        .sub-info { color: #aaa; margin-bottom: 25px; font-size: 0.95rem; }
        .movies-grid {
            display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .movie-card {
            background: #1e1e1e; border: 1px solid #333; border-radius: 14px;
            width: 290px; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 8px 22px rgba(0,0,0,0.6);
        }
        .movie-card img {
            width: 100%; height: 390px; object-fit: cover;
        }
        .movie-body {
            padding: 16px; flex: 1; display: flex; flex-direction: column;
            justify-content: space-between;
        }
        .movie-title { font-size: 1.15rem; font-weight: bold; margin: 0 0 8px 0; color: #fff; }
        .movie-meta { color: #bbb; font-size: 0.9rem; margin-bottom: 6px; }
        .movie-genre {
            color: #f5c518; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px;
        }
        .vote-options {
            display: flex; gap: 6px; justify-content: space-between;
        }
        .vote-label { flex: 1; }
        .vote-label input { display: none; }
        .vote-label span {
            display: block; padding: 10px 4px; border-radius: 8px;
            background: #2b2b2b; border: 2px solid #444; cursor: pointer;
            font-size: 0.85rem; font-weight: bold; user-select: none;
            transition: all 0.15s;
        }
        .vote-like input:checked + span {
            background: #2b8a3e; border-color: #40c057; color: #fff;
        }
        .vote-dislike input:checked + span {
            background: #c92a2a; border-color: #ff6b6b; color: #fff;
        }
        .vote-seen input:checked + span {
            background: #e67700; border-color: #ffa94d; color: #fff;
        }
        .submit-btn {
            background: #f5c518; color: #000; font-weight: bold;
            font-size: 1.15rem; padding: 15px 40px; border: none;
            border-radius: 10px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="turn-banner">
            🎬 Vez de {{ player[2] }} (Lote #{{ batch_num }})
        </div>
        <div class="sub-info">
            Filmes já aprovados pelo grupo: <strong>{{ approved_count }} / 3</strong>
        </div>

        <form action="/session/{{ session_id }}/movies/vote" method="POST">
            <input type="hidden" name="id_player" value="{{ player[0] }}">

            <div class="movies-grid">
                {% for m in movies %}
                <div class="movie-card">
                    <img src="{{ m[8] }}" alt="{{ m[1] }}">
                    <div class="movie-body">
                        <div>
                            <h3 class="movie-title">{{ m[1] }}</h3>
                            <div class="movie-meta">
                                📅 {{ m[2] }} &nbsp;|&nbsp; ⏱️ {{ m[4] }} &nbsp;|&nbsp; ⭐ {{ m[6] }}
                            </div>
                            <div class="movie-genre">{{ m[7] }}</div>
                        </div>

                        <input type="hidden" name="movie_ids" value="{{ m[0] }}">
                        <div class="vote-options">
                            <label class="vote-label vote-like">
                                <input type="radio" name="vote_{{ m[0] }}" value="1" required>
                                <span>👍 Gosto</span>
                            </label>
                            <label class="vote-label vote-dislike">
                                <input type="radio" name="vote_{{ m[0] }}" value="0">
                                <span>👎 Não Gosto</span>
                            </label>
                            <label class="vote-label vote-seen">
                                <input type="radio" name="vote_{{ m[0] }}" value="2">
                                <span>👁️ Já Vi</span>
                            </label>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="submit-btn">Confirmar Escolhas de {{ player[2] }} ➔</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ t.top3_banner }} {{ player[2] }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212; color: #fff;
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 25px 20px; text-align: center;
        }
        .top-bar {
            max-width: 900px; margin: 0 auto 12px auto;
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .lang-btn {
            background: #1e1e1e; color: #ccc; border: 1px solid #444;
            padding: 5px 10px; border-radius: 6px; text-decoration: none;
            font-size: 0.85rem; font-weight: bold;
        }
        .lang-btn.active { background: #f5c518; color: #000; border-color: #f5c518; }
        .turn-banner {
            background: #f5c518; color: #000; padding: 14px 24px;
            border-radius: 10px; font-weight: bold; font-size: 1.3rem;
            display: inline-block; margin-bottom: 10px;
        }
        p.sub { color: #bbb; margin-top: 0; margin-bottom: 28px; }
        .grid { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; margin-bottom: 30px; }
        .card-label { cursor: pointer; }
        .card-label input { display: none; }
        .card {
            background: #1e1e1e; border: 3px solid #333; border-radius: 14px;
            width: 280px; overflow: hidden; transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .card-label input:checked + .card {
            border-color: #f5c518; transform: translateY(-6px);
            box-shadow: 0 10px 28px rgba(245, 197, 24, 0.35);
        }
        .poster-wrap { position: relative; width: 100%; height: 380px; overflow: hidden; }
        .poster-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            transition: filter 0.3s ease, transform 0.3s ease;
        }
        .plot-overlay {
            position: absolute; inset: 0; padding: 22px 18px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
            opacity: 0; transition: opacity 0.3s ease;
            color: #fff; font-size: 0.92rem; line-height: 1.5;
            overflow-y: auto; pointer-events: none;
        }
        .plot-overlay strong { color: #f5c518; font-size: 1rem; margin-bottom: 8px; display: block; }
        .poster-wrap:hover img { filter: blur(6px) brightness(0.3); transform: scale(1.04); }
        .poster-wrap:hover .plot-overlay { opacity: 1; }
        .card-body { padding: 16px; }
        .card-title { font-size: 1.15rem; font-weight: bold; margin: 0 0 8px 0; }
        .card-meta { color: #aaa; font-size: 0.9rem; margin-bottom: 8px; }
        .card-genre { color: #f5c518; font-size: 0.85rem; font-weight: bold; }
        .pick-badge {
            margin-top: 12px; background: #2b2b2b; color: #ddd;
            padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.9rem;
        }
        .card-label input:checked + .card .pick-badge { background: #f5c518; color: #000; }
        .btn {
            background: #f5c518; color: #000; font-weight: bold;
            font-size: 1.15rem; padding: 15px 40px; border: none; border-radius: 10px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/set_lang/pt" class="lang-btn {% if lang == 'pt' %}active{% endif %}">🇵🇹 PT</a>
        <a href="/set_lang/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">🇬🇧 EN</a>
        <a href="/set_lang/es" class="lang-btn {% if lang == 'es' %}active{% endif %}">🇪🇸 ES</a>
    </div>

    <div class="turn-banner">
        🌟 {{ t.top3_banner }} {{ player[2] }} ({{ player[1] }}/{{ total_players }})
    </div>
    <p class="sub">{{ t.top3_sub }}</p>

    <form action="/session/{{ session_id }}/top3" method="POST">
        <input type="hidden" name="id_player" value="{{ player[0] }}">
        <div class="grid">
            {% for m in finalists %}
            <label class="card-label">
                <input type="radio" name="id_movie" value="{{ m[0] }}" required>
                <div class="card">
                    <div class="poster-wrap">
                        <img src="{{ m[6] }}" alt="{{ m[1] }}">
                        <div class="plot-overlay">
                            <strong>📖 {{ t.synopsis_title }}</strong>
                            <span>{{ m[7] if m[7] else t.synopsis_empty }}</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">{{ m[1] }}</div>
                        <div class="card-meta">📅 {{ m[2] }} &nbsp;|&nbsp; ⏱️ {{ m[3] }} &nbsp;|&nbsp; ⭐ {{ m[4] }}</div>
                        <div class="card-genre">{{ tr_genres(m[5], lang) }}</div>
                        <div class="pick-badge">{{ t.top3_pick_badge }}</div>
                    </div>
                </div>
            </label>
            {% endfor %}
        </div>
        <button type="submit" class="btn">{{ t.btn_confirm_secret }} {{ player[2] }} ➔</button>
    </form>
</body>
</html>

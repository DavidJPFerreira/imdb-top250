<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.top3_banner }} {{ player[2] }}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E6392E'%3E%3Cpath d='M2.00488 9.49979V3.99979C2.00488 3.4475 2.4526 2.99979 3.00488 2.99979H21.0049C21.5572 2.99979 22.0049 3.4475 22.0049 3.99979V9.49979C20.6242 9.49979 19.5049 10.6191 19.5049 11.9998C19.5049 13.3805 20.6242 14.4998 22.0049 14.4998V19.9998C22.0049 20.5521 21.5572 20.9998 21.0049 20.9998H3.00488C2.4526 20.9998 2.00488 20.5521 2.00488 19.9998V14.4998C3.38559 14.4998 4.50488 13.3805 4.50488 11.9998C4.50488 10.6191 3.38559 9.49979 2.00488 9.49979ZM14.0049 4.99979H4.00488V7.96755C5.4866 8.7039 6.50488 10.2329 6.50488 11.9998C6.50488 13.7666 5.4866 15.2957 4.00488 16.032V18.9998H14.0049V4.99979ZM16.0049 4.99979V18.9998H20.0049V16.032C18.5232 15.2957 17.5049 13.7666 17.5049 11.9998C17.5049 10.2329 18.5232 8.7039 20.0049 7.96755V4.99979H16.0049Z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #F4EEDD;
            --bg-paper-alt: #EFECE6;
            --red: #E6392E;
            --yellow: #F4B41A;
            --blue: #1B4965;
            --black: #181818;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-paper);
            background-image: 
                linear-gradient(to right, rgba(24,24,24,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(24,24,24,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--black);
            font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 25px 20px 60px 20px; text-align: center;
        }
        .top-bar {
            max-width: 1020px; margin: 0 auto 14px auto;
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .lang-btn {
            background: var(--bg-paper-alt); color: var(--black); border: 3px solid var(--black);
            box-shadow: 3px 3px 0px var(--black); padding: 5px 12px;
            text-decoration: none; font-family: 'Space Mono', monospace; font-size: 0.82rem; font-weight: 700;
            transition: transform 0.15s;
        }
        .lang-btn:hover { transform: translate(-2px, -2px) rotate(-2deg); }
        .lang-btn.active { background: var(--yellow); color: var(--black); transform: rotate(-2deg); }

        .turn-banner {
            background: var(--yellow); color: var(--black); padding: 14px 28px;
            border: 4px solid var(--black); box-shadow: 6px 6px 0px var(--black);
            font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 1.5px;
            display: inline-block; margin-bottom: 10px; transform: rotate(-1deg);
        }
        p.sub {
            font-family: 'Space Mono', monospace; color: var(--black);
            font-weight: 700; margin-top: 0; margin-bottom: 28px; font-size: 0.9rem;
        }
        /* Grelha e Cartões de Filmes Uniformizados (300px x 560px) */
        .grid { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; margin-bottom: 34px; }
        .card-label { cursor: pointer; }
        .card-label input { display: none; }
        .card {
            background: var(--bg-paper-alt); border: 4px solid var(--black);
            box-shadow: 8px 8px 0px var(--black);
            width: 300px; height: 560px;
            overflow: hidden; transition: all 0.15s; position: relative;
            display: flex; flex-direction: column;
        }
        .card-label input:checked + .card {
            background: var(--yellow);
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px var(--red);
        }
        .movies-grid .movie-card:nth-child(odd), .grid .card-label:nth-child(odd) { transform: rotate(-0.9deg); }
        .movies-grid .movie-card:nth-child(even), .grid .card-label:nth-child(even) { transform: rotate(0.9deg); }
        .poster-wrap {
            position: relative; width: 100%; height: 380px; flex-shrink: 0; overflow: hidden;
            border-bottom: 4px solid var(--black);
        }
        .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .plot-overlay {
            position: absolute; inset: 0; padding: 22px 18px;
            background: rgba(24,24,24,0.94);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
            opacity: 0; transition: opacity 0.2s ease;
            color: var(--bg-paper); font-size: 0.92rem; line-height: 1.5;
            overflow-y: auto; pointer-events: none;
        }
        .plot-overlay strong {
            font-family: 'Bebas Neue', sans-serif; color: var(--yellow);
            font-size: 1.4rem; margin-bottom: 8px; display: block;
        }
        .poster-wrap:hover .plot-overlay { opacity: 1; }
        .card-body {
            padding: 14px 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-title {
            font-family: 'Bebas Neue', sans-serif; font-size: 1.55rem; letter-spacing: 1px;
            margin: 0 0 4px 0; line-height: 1.05;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            min-height: 3.2rem;
        }
        .card-meta {
            font-family: 'Space Mono', monospace; font-size: 0.78rem; font-weight: 700; margin-bottom: 6px;
        }
        .card-genre {
            display: inline-block; background: var(--black); color: var(--bg-paper);
            font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 700; padding: 3px 8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }
        .pick-badge {
            height: 40px; display: flex; align-items: center; justify-content: center;
            background: var(--bg-paper); color: var(--black);
            border: 3px solid var(--black); box-shadow: 3px 3px 0px var(--black);
            font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.82rem;
        }
        .card-label input:checked + .card .pick-badge {
            background: var(--red); color: var(--bg-paper);
        }

        /* Botão-Bilhete com Rasgão até Metade */
        .ticket-tear-btn {
            display: inline-flex; align-items: stretch;
            background: transparent; border: none; padding: 0;
            text-decoration: none; cursor: pointer;
            perspective: 1000px; filter: drop-shadow(6px 6px 0px var(--black));
            transition: filter 0.2s ease, transform 0.2s ease;
        }
        .ticket-tear-btn .t-main {
            background:
                radial-gradient(circle at right top, transparent 10px, var(--red) 10.5px),
                radial-gradient(circle at right bottom, transparent 10px, var(--red) 10.5px);
            background-size: 100% 51%;
            background-position: top, bottom;
            background-repeat: no-repeat;
            color: var(--black);
            padding: 16px 28px;
            border: 3px solid var(--black); border-right: none;
            display: flex; align-items: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 1.75rem; letter-spacing: 2px;
            text-transform: uppercase;
            transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            transform-origin: left center;
        }
        .ticket-tear-btn .t-perf {
            width: 0; border-left: 3px dashed var(--black);
            background: var(--bg-paper); margin: 10px 0; z-index: 2;
            transition: opacity 0.25s ease;
        }
        .ticket-tear-btn .t-stub {
            background:
                radial-gradient(circle at left top, transparent 10px, var(--red) 10.5px),
                radial-gradient(circle at left bottom, transparent 10px, var(--red) 10.5px);
            background-size: 100% 51%;
            background-position: top, bottom;
            background-repeat: no-repeat;
            color: var(--black);
            padding: 12px 20px;
            border: 3px solid var(--black); border-left: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 700;
            line-height: 1.2;
            transform-origin: top left;
            transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ticket-tear-btn .t-barcode {
            width: 54px; height: 16px; margin-bottom: 4px;
            background: repeating-linear-gradient(90deg, #181818 0, #181818 2px, transparent 2px, transparent 4px, #181818 4px, #181818 7px, transparent 7px, transparent 9px);
        }
        /* Animação de rasgar até metade */
        .ticket-tear-btn:hover .t-main {
            transform: rotate(-1.5deg) translateX(-3px);
        }
        .ticket-tear-btn:hover .t-stub {
            transform: translateY(10px) translateX(5px) rotateZ(8deg);
        }
        .ticket-tear-btn:active .t-stub {
            transform: translateY(22px) translateX(12px) rotateZ(16deg);
        }

    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/set_lang/pt" class="lang-btn {% if lang == 'pt' %}active{% endif %}">PT</a>
        <a href="/set_lang/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">EN</a>
        <a href="/set_lang/es" class="lang-btn {% if lang == 'es' %}active{% endif %}">ES</a>
    </div>

    <div class="turn-banner">
        {{ t.top3_banner }} {{ player[2] }} ({{ player[1] }}/{{ total_players }})
    </div>
    <p class="sub">{{ t.top3_sub }}</p>

    <form action="/session/{{ session_id }}/top3" method="POST">
        <input type="hidden" name="id_player" value="{{ player[0] }}">
        <div class="grid">
            {% for m in finalists %}
            <label class="card-label">
                <input type="radio" name="id_movie" value="{{ m[0] }}" required>
                <div class="card">
                    <div class="poster-wrap">
                        <img src="{{ m[6] }}" alt="{{ m[1] }}">
                        <div class="plot-overlay">
                            <strong>{{ t.synopsis_title }}</strong>
                            <span>{{ m[7] if m[7] else t.synopsis_empty }}</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="card-title">{{ m[1] }}</div>
                            <div class="card-meta">{{ m[2] }} &nbsp;|&nbsp; {{ m[3] }} &nbsp;|&nbsp; IMDb {{ m[4] }}</div>
                            <div class="card-genre">{{ tr_genres(m[5], lang) }}</div>
                        </div>
                        <div class="pick-badge">{{ t.top3_pick_badge }}</div>
                    </div>
                </div>
            </label>
            {% endfor %}
        </div>
        <button type="submit" class="ticket-tear-btn">
                    <span class="t-main">{{ t.btn_confirm_secret }} {{ player[2] }}</span>
                    <span class="t-perf"></span>
                    <span class="t-stub">
                        <span class="t-barcode"></span>
                        <span>Nº314159</span>
                    </span>
        </button>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login Admin - IMDb Movie Game</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0e0e0e; color: #fff;
            font-family: 'Segoe UI', sans-serif; margin: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .login-card {
            background: #1a1a1a; border: 1px solid #333; border-radius: 14px;
            width: 100%; max-width: 400px; padding: 32px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { color: #f5c518; margin: 0 0 10px 0; font-size: 1.6rem; }
        p { color: #aaa; font-size: 0.92rem; margin: 0 0 24px 0; }
        input[type="password"] {
            width: 100%; padding: 12px 14px; border-radius: 8px;
            border: 1px solid #444; background: #121212; color: #fff;
            font-size: 1rem; margin-bottom: 16px;
        }
        input[type="password"]:focus { outline: none; border-color: #f5c518; }
        .btn {
            width: 100%; background: #f5c518; color: #000; font-weight: bold;
            padding: 12px; border: none; border-radius: 8px; font-size: 1.05rem;
            cursor: pointer;
        }
        .error {
            background: #4a151b; border: 1px solid #e63946; color: #ff8787;
            padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem;
        }
        .back-link {
            display: inline-block; margin-top: 18px; color: #888;
            text-decoration: none; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔒 Acesso Admin</h1>
        <p>Introduz a password de administrador para veres a Dashboard</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/admin/login" method="POST">
            <input type="password" name="password" placeholder="Password de Admin" required autofocus>
            <button type="submit" class="btn">Entrar na Dashboard ➔</button>
        </form>

        <a href="/" class="back-link">⬅ Voltar ao Jogo</a>
    </div>
</body>
</html>

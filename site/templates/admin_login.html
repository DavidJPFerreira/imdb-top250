<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - IMDb Movie Game</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E6392E'%3E%3Cpath d='M2.00488 9.49979V3.99979C2.00488 3.4475 2.4526 2.99979 3.00488 2.99979H21.0049C21.5572 2.99979 22.0049 3.4475 22.0049 3.99979V9.49979C20.6242 9.49979 19.5049 10.6191 19.5049 11.9998C19.5049 13.3805 20.6242 14.4998 22.0049 14.4998V19.9998C22.0049 20.5521 21.5572 20.9998 21.0049 20.9998H3.00488C2.4526 20.9998 2.00488 20.5521 2.00488 19.9998V14.4998C3.38559 14.4998 4.50488 13.3805 4.50488 11.9998C4.50488 10.6191 3.38559 9.49979 2.00488 9.49979ZM14.0049 4.99979H4.00488V7.96755C5.4866 8.7039 6.50488 10.2329 6.50488 11.9998C6.50488 13.7666 5.4866 15.2957 4.00488 16.032V18.9998H14.0049V4.99979ZM16.0049 4.99979V18.9998H20.0049V16.032C18.5232 15.2957 17.5049 13.7666 17.5049 11.9998C17.5049 10.2329 18.5232 8.7039 20.0049 7.96755V4.99979H16.0049Z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #F4EEDD;
            --bg-paper-alt: #EFECE6;
            --red: #E6392E;
            --yellow: #F4B41A;
            --blue: #1B4965;
            --black: #181818;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-paper);
            background-image: 
                linear-gradient(to right, rgba(24,24,24,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(24,24,24,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--black);
            font-family: 'Space Grotesk', sans-serif; margin: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .login-card {
            background: var(--bg-paper-alt); border: 5px solid var(--black);
            box-shadow: 12px 12px 0px var(--black);
            width: 100%; max-width: 420px; padding: 36px; text-align: center;
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif; color: var(--black);
            margin: 0 0 10px 0; font-size: 2.8rem; letter-spacing: 1.5px;
            text-shadow: 3px 3px 0px var(--yellow);
        }
        p {
            font-family: 'Space Mono', monospace; color: var(--black);
            font-size: 0.85rem; margin: 0 0 24px 0; font-weight: 700;
        }
        input[type="password"] {
            width: 100%; padding: 12px 14px;
            border: 3px solid var(--black); background: #fff; color: var(--black);
            font-family: 'Space Mono', monospace; font-size: 1rem; margin-bottom: 18px;
        }
        input[type="password"]:focus { outline: none; background: #fff9db; border-color: var(--red); }
        .ticket-btn {
            width: 100%; background: var(--red); color: var(--bg-paper);
            font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 1.5px;
            padding: 12px; border: 3px solid var(--black); box-shadow: 5px 5px 0px var(--black);
            cursor: pointer;
        }
        .error {
            background: var(--red); border: 3px solid var(--black); color: var(--bg-paper);
            padding: 10px; margin-bottom: 16px; font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: 700;
        }
        .back-link {
            display: inline-block; margin-top: 20px; color: var(--black);
            font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Acesso Admin</h1>
        <p>Introduz a password de administrador</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/admin/login" method="POST">
            <input type="password" name="password" placeholder="Password de Admin" required autofocus>
            <button type="submit" class="ticket-btn">Entrar na Dashboard ➔</button>
        </form>

        <a href="/" class="back-link">⬅ Voltar ao Jogo</a>
    </div>
</body>
</html>

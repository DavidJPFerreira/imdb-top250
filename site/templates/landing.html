<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ t.hero_title }}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 25px 20px 50px 20px; text-align: center;
        }
        .top-bar {
            max-width: 1000px; margin: 0 auto 20px auto;
            display: flex; justify-content: flex-end; gap: 10px;
        }
        .lang-btn {
            background: #1e1e1e; color: #ccc; border: 1px solid #444;
            padding: 6px 12px; border-radius: 6px; text-decoration: none;
            font-size: 0.88rem; font-weight: bold;
        }
        .lang-btn.active {
            background: #f5c518; color: #000; border-color: #f5c518;
        }
        .hero {
            max-width: 820px; margin: 0 auto 40px auto; padding: 45px 30px;
            background: linear-gradient(145deg, #1e1e1e, #161616);
            border-radius: 18px; border: 1px solid #2e2e2e;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
        }
        h1 { color: #f5c518; font-size: 2.3rem; margin: 0 0 14px 0; }
        p.subtitle { color: #ccc; font-size: 1.12rem; margin: 0 0 30px 0; line-height: 1.5; }
        .cta-btn {
            display: inline-block; background: #f5c518; color: #000;
            font-weight: bold; font-size: 1.25rem; padding: 16px 46px;
            border-radius: 10px; text-decoration: none;
            box-shadow: 0 6px 20px rgba(245, 197, 24, 0.35);
            transition: transform 0.2s, background 0.2s;
        }
        .cta-btn:hover { transform: translateY(-3px); background: #e2b616; }

        .steps-section { max-width: 1000px; margin: 0 auto; }
        .steps-section h2 { color: #f5c518; font-size: 1.6rem; margin-bottom: 24px; }
        .steps-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px; text-align: left;
        }
        .step-card {
            background: #1b1b1b; border: 1px solid #2e2e2e;
            border-top: 4px solid #f5c518; border-radius: 12px; padding: 22px;
        }
        .step-card h3 { color: #fff; margin: 0 0 10px 0; font-size: 1.08rem; }
        .step-card p { color: #aaa; margin: 0; font-size: 0.92rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/set_lang/pt" class="lang-btn {% if lang == 'pt' %}active{% endif %}">🇵🇹 PT</a>
        <a href="/set_lang/en" class="lang-btn {% if lang == 'en' %}active{% endif %}">🇬🇧 EN</a>
        <a href="/set_lang/es" class="lang-btn {% if lang == 'es' %}active{% endif %}">🇪🇸 ES</a>
    </div>

    <div class="hero">
        <h1>{{ t.hero_title }}</h1>
        <p class="subtitle">{{ t.hero_subtitle }}</p>
        <a href="/setup" class="cta-btn">{{ t.btn_start_now }}</a>
    </div>

    <div class="steps-section">
        <h2>{{ t.how_it_works }}</h2>
        <div class="steps-grid">
            <div class="step-card">
                <h3>👥 {{ t.step1_title }}</h3>
                <p>{{ t.step1_desc }}</p>
            </div>
            <div class="step-card">
                <h3>⚔️ {{ t.step2_title }}</h3>
                <p>{{ t.step2_desc }}</p>
            </div>
            <div class="step-card">
                <h3>🍿 {{ t.step3_title }}</h3>
                <p>{{ t.step3_desc }}</p>
            </div>
            <div class="step-card">
                <h3>🏆 {{ t.step4_title }}</h3>
                <p>{{ t.step4_desc }}</p>
            </div>
        </div>
    </div>
</body>
</html>
